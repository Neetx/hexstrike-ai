services:
  hexstrike-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        HEXSTRIKE_TOOLSET: ${HEXSTRIKE_TOOLSET:-core}
    image: hexstrike-ai:yenn-v6.1-local
    container_name: hexstrike-ai-server
    init: true
    environment:
      HEXSTRIKE_HOST: 0.0.0.0
      HEXSTRIKE_PORT: 8888
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:${HEXSTRIKE_PORT:-8888}:8888"
    volumes:
      - hexstrike-files:/tmp/hexstrike_files
      - hexstrike-cache:/root/.cache
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8888/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    restart: unless-stopped

volumes:
  hexstrike-files:
  hexstrike-cache:
